<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Diverse and Personalized Recommendations through Generative AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ROOT */
        :root {
            --bg: #020617;
            --glass: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
            --text: #e2e8f0;
            --accent: #8b5cf6;
        }

        /* RESET */
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #020617);
            color: var(--text);
            min-height: 100vh;
            display:flex;
            flex-direction:column;
        }

        /* GLOW BACKGROUND */
        body::before, body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #8b5cf6, transparent);
            filter: blur(150px);
            z-index: -1;
        }
        body::before { top:-100px; left:-100px; }
        body::after { bottom:-100px; right:-100px; }

        /* NAVBAR */
        header {
            position: fixed;
            width: 100%;
            top: 0;
            backdrop-filter: blur(20px);
            background: rgba(2,6,23,0.6);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .navbar {
            max-width: 1300px;
            margin:auto;
            padding: 1rem 2rem;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .navbar h1 {
            font-weight:600;
            background: linear-gradient(90deg,#a78bfa,#38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar ul {
            display:flex;
            gap:1rem;
            list-style:none;
        }

        .navbar a {
            text-decoration:none;
            color:var(--text);
            padding:8px 14px;
            border-radius:8px;
            display:flex;
            align-items:center;
            gap:6px;
            transition:0.3s;
        }

        .navbar a:hover {
            background: var(--glass);
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin:120px auto 40px;
            padding: 2rem;
            flex:1;
        }

        /* GLASS CARD SECTIONS */
        .form-section, .output-section, .table-section {
            background: var(--glass);
            border:1px solid var(--border);
            backdrop-filter: blur(20px);
            padding:2rem;
            border-radius:20px;
            margin-bottom:2rem;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6);
            transition:0.3s;
        }

        .form-section:hover, .output-section:hover, .table-section:hover {
            transform: translateY(-6px) scale(1.01);
        }

        h2 {
            margin-bottom:1.5rem;
            background: linear-gradient(90deg,#a78bfa,#38bdf8);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        textarea, select, input[type="file"] {
            width:100%;
            padding:1rem;
            margin-bottom:1rem;
            border-radius:12px;
            border:1px solid var(--border);
            background:rgba(255,255,255,0.05);
            color:white;
            outline:none;
        }

        textarea:focus, select:focus, input:focus {
            border-color:#8b5cf6;
            box-shadow:0 0 12px rgba(139,92,246,0.4);
        }

        /* BUTTON */
        button {
            padding:1rem 2rem;
            border:none;
            border-radius:12px;
            background: linear-gradient(135deg,#6d28d9,#9333ea);
            color:white;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover {
            transform:translateY(-3px);
            box-shadow:0 10px 25px rgba(139,92,246,0.4);
        }

        /* TABLE */
        table {
            width:100%;
            border-collapse: collapse;
        }

        th, td {
            padding:1rem;
            border-bottom:1px solid var(--border);
        }

        th {
            color:#a78bfa;
        }

        tr:hover {
            background:rgba(255,255,255,0.05);
        }

        /* CODE BLOCK */
        pre {
            background:rgba(255,255,255,0.05);
            padding:1rem;
            border-radius:10px;
            overflow:auto;
        }

        /* ALERTS */
        .alert {
            margin-top:1rem;
            padding:0.8rem;
            border-radius:8px;
            text-align:center;
        }

        .alert-error {
            background: rgba(248,113,113,0.1);
            border:1px solid rgba(248,113,113,0.3);
            color:#f87171;
        }

        .alert-success {
            background: rgba(34,197,94,0.1);
            border:1px solid rgba(34,197,94,0.3);
            color:#22c55e;
        }

        .alert-info {
            background: rgba(59,130,246,0.1);
            border:1px solid rgba(59,130,246,0.3);
            color:#3b82f6;
        }

        /* FOOTER */
        footer {
            text-align:center;
            padding:1.5rem;
            border-top:1px solid var(--border);
            margin-top:auto;
        }

        @media(max-width:768px){
            .navbar { flex-direction:column; }
            .navbar ul { flex-direction:column; margin-top:1rem; }
        }
    </style>
</head>

<body>

<header>
    <div class="navbar">
        <h1>Admin Dashboard</h1>
        <ul>
            <li><a href="{% url 'AdminHome' %}"><i data-lucide="home"></i> Home</a></li>
            <li><a href="{% url 'RegisterUsersView' %}"><i data-lucide="users"></i> User Details</a></li>
            <li><a href="{% url 'base' %}"><i data-lucide="log-out"></i> Logout</a></li>
        </ul>
    </div>
</header>

<div class="container">

    <!-- 🔥 DJANGO MESSAGES -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert 
                {% if message.tags == 'error' %}alert-error
                {% elif message.tags == 'success' %}alert-success
                {% else %}alert-info
                {% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}



</div>

<footer>
    <p>© 2025 A Review of Generative AI in Recommendation Systems. All rights reserved.</p>
</footer>

<script>
lucide.createIcons();
</script>

</body>
</html>
